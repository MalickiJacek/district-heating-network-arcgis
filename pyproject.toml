[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dhnet"
version = "1.0.0"
description = "District heating network generation on a street graph (iterative Closest Facility) and pipe sizing"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jacek Malicki" }]
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.0",
  "shapely>=2.0",
  "geopandas>=0.14",
  "pandas>=1.5",
  "pyogrio>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
dhnet = "dhnet.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
