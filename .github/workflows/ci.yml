name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: CLI smoke test on sample data
        run: |
          python -m dhnet \
            --streets data/sample/Streets.shp \
            --buildings data/sample/Buildings.shp \
            --source data/sample/HeatSource.shp \
            --out output
